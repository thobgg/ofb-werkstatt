# Konfiguration. Alles Ortsspezifische steht hier, nicht im Code.

[gemeinde]
name       = "Musterhausen"
ort_default = "Musterhausen"      # Vorbelegung fuer Orts-Felder
religion_default = "evangelisch"

[bestand]
# Optional: vorhandener GEDCOM-Bestand, gegen den angebunden wird.
# Leer lassen, wenn bei Null angefangen wird — dann waechst der
# Bestand aus der eigenen Erfassung.
gedcom = ""

# ---------------------------------------------------------------- Kontext
# Womit abgeglichen wird. Beliebig viele Quellen, jede mit ihrem RANG:
#
#     gilt = "beleg"       darf bestaetigen  -> ein Treffer macht gruen
#     gilt = "vokabular"   rankt nur         -> ein Treffer bleibt gelb
#
# Der Unterschied ist nicht Feinheit, sondern die Lehre aus dem Pilotlauf:
# `Roth` kommt 59-mal im Bestand vor und haette jeden Plausibilitaetstest
# bestanden — dabei stand `Koch` da. Haeufigkeit und Wortschatz duerfen
# ranken, aber niemals bestaetigen. Gruen wird nur, was ein Anker traegt.
#
# Ein Bestand kann beides sein: fuer die eigene Parochie belastbar, fuer
# fremde nur Wortschatz. Dafuer `parochien` setzen und `sonst`.
#
# Nichts eingetragen heisst Nullstart. Das ist erlaubt: dann bleibt alles
# gelb und die Maske legt jedes Feld vor. Langsamer, aber nicht falsch.
#
# Eigene Pfade gehoeren nach konfig.local.toml — die steht in .gitignore.
#
# [[kontext]]
# name      = "Eigenes Ortsfamilienbuch"
# art       = "gedcom"
# datei     = "quellen/OFB_Musterhausen.ged"
# gilt      = "beleg"
# parochien = ["Musterhausen"]
# bis_jahr  = 1807                 # danach traegt es nicht mehr
#
# [[kontext]]
# name      = "Kirchenbuchdatenbank der Nachbarschaft"
# art       = "sqlite"
# datei     = "~/kirchenbuch.db"
# gilt      = "beleg"
# parochien = ["Musterhausen", "Nachbarort"]   # nur hier belastbar
# sonst     = "vokabular"                      # ueberall sonst nur Wortschatz
#
# [[kontext]]
# name  = "Namensatlas der Region"
# art   = "csv"
# datei = "~/atlas_export/"
# gilt  = "vokabular"

[register.ehe]
titel   = "Eheregister"
ordner  = "bilder/ehe"
personen = ["braeutigam", "braut"]
felder  = ["lfd_nr",
           "braeutigam_name", "braeutigam_beruf", "braeutigam_ort",
           "braeutigam_stand", "braeutigam_vater", "braeutigam_mutter",
           "braeutigam_geburt_datum", "braeutigam_geburt_ort",
           "braut_name", "braut_ort", "braut_stand",
           "braut_vater", "braut_mutter",
           "braut_geburt_datum", "braut_geburt_ort",
           "proklamation", "trauung_datum", "trauung_ort",
           "trauender", "zeugen", "randvermerk"]
datum   = ["trauung_datum"]

[register.taufe]
titel   = "Taufregister"
ordner  = "bilder/taufe"
personen = ["kind", "vater", "mutter"]
felder  = ["lfd_nr", "kind_vorname", "kind_geschlecht",
           "geburt_datum", "geburt_ort", "tauf_datum", "tauf_ort",
           "vater_name", "vater_beruf", "vater_ort",
           "mutter_name", "mutter_herkunft",
           "taufender", "paten", "randvermerk"]
datum   = ["geburt_datum", "tauf_datum"]

[register.tod]
titel   = "Sterberegister"
ordner  = "bilder/tod"
personen = ["verstorbener"]
felder  = ["lfd_nr", "verstorbener_name", "verstorbener_beruf",
           "verstorbener_ort", "sterbe_datum", "begraebnis_datum",
           "alter", "todesursache", "hinterbliebene", "randvermerk"]
datum   = ["sterbe_datum", "begraebnis_datum"]
